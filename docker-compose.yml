# Бэкенд веб-чата по документам школы на общем индексе.
# Перед запуском: заполните .env (см. .env.example) и положите PDF в ./data/docs
# (через краулер или scripts/fetch_sources.py), затем разово соберите индекс:
#   docker compose run --rm api python -m scripts.reindex

services:
  api:
    build: .
    image: qletovo-assistant
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8765"
    ports:
      - "8765:8765"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
