<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Хочешь в Летово? — ассистент по документам</title>
<meta name="theme-color" content="#143282" />
<link rel="icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#143282; --navy-d:#0e2455; --navy-l:#2a4ea8;
    --gold:#f5c518; --gold-soft:#fff6d6;
    --ink:#19203a; --muted:#6c7385; --line:#e9ecf4; --bg:#ffffff;
    --user:#eef2fb; --card:#f7f9fd;
    --shadow:0 6px 24px rgba(20,50,130,.08);
    --shadow-sm:0 2px 8px rgba(20,50,130,.06);
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink); background:var(--bg);
    display:flex; flex-direction:column; height:100dvh; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  /* header — компактный */
  header{
    position:sticky; top:0; z-index:5; background:rgba(255,255,255,.94);
    backdrop-filter:saturate(1.1) blur(8px);
    border-bottom:1px solid var(--line);
    border-top:2px solid var(--navy);
    padding:8px 16px; display:flex; align-items:center; gap:10px;
  }
  header .logo{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  header .logo img{width:40px;height:40px;object-fit:contain;}
  header .htext h1{font-size:16px;font-weight:800;margin:0;color:var(--navy);letter-spacing:.2px;line-height:1.2;}
  header .htext p{font-size:12px;color:var(--muted);margin:1px 0 0;font-weight:600;line-height:1.25;}
  /* feed */
  main{flex:1; overflow-y:auto; padding:26px 18px 110px;}
  .feed{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px;}
  .row{display:flex;gap:12px;align-items:flex-start;animation:fadeUp .35s ease both;}
  .row.user{justify-content:flex-end;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .avatar{
    width:34px;height:34px;border-radius:50%;flex:none;background:#fff;
    border:1px solid var(--line);box-shadow:var(--shadow-sm);
    display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:2px;
  }
  .avatar img{width:26px;height:26px;object-fit:contain;}
  .role{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;}
  /* assistant bubble */
  .bot .content{max-width:88%;}
  .bot .bubble{
    background:var(--card);border:1px solid var(--line);border-radius:6px 16px 16px 16px;
    padding:14px 16px;box-shadow:var(--shadow-sm);
  }
  .bot .text{white-space:pre-wrap;word-wrap:break-word;}
  .bot .text strong{color:var(--navy);font-weight:800;}
  /* user bubble */
  .user .bubble{
    background:var(--navy);color:#fff;border-radius:16px 16px 6px 16px;
    padding:11px 16px;max-width:80%;white-space:pre-wrap;box-shadow:var(--shadow-sm);font-weight:600;
  }
  /* sources */
  .sources{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);}
  .sources .label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:9px;display:flex;align-items:center;gap:6px;}
  .src{
    display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;
    transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;
  }
  .src:last-child{margin-bottom:0;}
  .src:hover{transform:translateY(-1px);border-color:var(--navy-l);box-shadow:var(--shadow);}
  .src .ic{width:30px;height:30px;flex:none;border-radius:8px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;}
  .src .ic svg{width:17px;height:17px;}
  .src .meta{min-width:0;flex:1;}
  .src .ttl{font-weight:700;font-size:14px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .src .pg{font-size:12px;color:var(--muted);font-weight:600;}
  .src .arrow{color:var(--muted);flex:none;}
  /* greeting chips */
  .greeting p{margin:0 0 12px;color:var(--muted);font-weight:600;}
  .chips{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:8px;}
  .chip{
    border:1px solid var(--navy);color:var(--navy);background:#fff;border-radius:14px;
    padding:10px 15px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;
    text-align:left;line-height:1.35;white-space:nowrap;
    transition:background .12s ease,color .12s ease,transform .1s ease;
  }
  .chip:hover{background:var(--navy);color:#fff;transform:translateY(-1px);}
  .chip .short{display:none;}  /* по умолчанию (десктоп) показываем полную формулировку */
  /* typing */
  .typing{display:flex;gap:5px;padding:4px 2px;}
  .typing span{width:8px;height:8px;border-radius:50%;background:var(--navy-l);opacity:.5;animation:blink 1.3s infinite both;}
  .typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0);}30%{opacity:1;transform:translateY(-3px);}}
  /* composer — плавающий островок снизу; контент уходит под него и прячется фейдом */
  footer{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    display:flex; justify-content:center;
    padding:28px 16px calc(18px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 62%, rgba(255,255,255,0));
    pointer-events:none;
  }
  form.composer{
    pointer-events:auto; width:min(720px,100%);
    display:flex; gap:8px; align-items:flex-end;
    background:#fff; border:1px solid var(--line); border-radius:26px;
    box-shadow:0 10px 30px rgba(20,50,130,.14);
    padding:6px 6px 6px 8px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  form.composer:focus-within{border-color:var(--navy);box-shadow:0 10px 30px rgba(20,50,130,.18), 0 0 0 3px rgba(20,50,130,.10);}
  textarea{
    flex:1;resize:none;border:none;outline:none;background:transparent;font:inherit;color:var(--ink);
    max-height:150px;height:44px;padding:10px 8px;line-height:24px;
  }
  .send{
    border:none;background:var(--navy);color:#fff;border-radius:50%;width:44px;height:44px;flex:none;
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s ease,transform .1s ease;
  }
  .send:hover{background:var(--navy-d);}
  .send:active{transform:scale(.94);}
  .send:disabled{opacity:.45;cursor:default;}
  .send svg{width:20px;height:20px;}
  @media (max-width:600px){
    header{padding:7px 12px; gap:9px;}
    header .logo,header .logo img{width:36px;height:36px;}
    .htext h1{font-size:15px;}
    .htext p{display:none;}                 /* на телефоне держим шапку максимально узкой */
    main{padding:16px 11px 100px;}
    .feed{gap:14px;}
    .row{gap:9px;}
    .avatar{width:28px;height:28px;margin-top:1px;}
    .avatar img{width:22px;height:22px;}
    .bot .content{max-width:100%;}
    .bot .bubble{padding:12px 13px;border-radius:4px 14px 14px 14px;}
    .user .bubble{padding:10px 13px;max-width:88%;}
    .chip{font-size:13px;padding:7px 12px;max-width:100%;}
    .chip .full{display:none;} .chip .short{display:inline;}
    .src{padding:9px 10px;gap:9px;}
    .src .ttl{font-size:13px;white-space:normal;}
    footer{padding:22px 10px calc(12px + env(safe-area-inset-bottom));}
    form.composer{width:100%;border-radius:24px;}
    textarea{font-size:16px;}                /* >=16px — iOS не зумит при фокусе */
  }
  @media (max-width:380px){
    .htext h1{font-size:14px;}
  }
</style>
</head>
<body>
  <header>
    <span class="logo"><img src="/media/qletovo-logo.png" alt="Летово" /></span>
    <div class="htext">
      <h1>Хочешь в Летово?</h1>
      <p>Отвечаю по официальным документам школы — со ссылкой на страницу первоисточника</p>
    </div>
  </header>

  <main id="main">
    <div class="feed" id="feed">
      <div class="row bot">
        <span class="avatar"><img src="/media/qletovo-logo.png" alt="" /></span>
        <div class="content">
          <div class="role">Ассистент</div>
          <div class="bubble">
            <div class="greeting">
              <p>Здравствуйте! Спросите что угодно о школе «Летово» — например:</p>
              <div class="chips" id="chips">
                <button class="chip" data-q="В какие классы можно поступить?"><span class="full">В какие классы можно поступить?</span><span class="short">В какие классы поступить?</span></button>
                <button class="chip" data-q="Какие документы нужны для поступления?"><span class="full">Какие документы нужны для поступления?</span><span class="short">Документы для поступления</span></button>
                <button class="chip" data-q="Какие права есть у обучающихся?"><span class="full">Какие права есть у обучающихся?</span><span class="short">Права обучающихся</span></button>
                <button class="chip" data-q="Что грозит за нарушение академической честности?"><span class="full">Что грозит за нарушение академической честности?</span><span class="short">Что будет за списывание?</span></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <form id="form" class="composer">
      <textarea id="input" placeholder="Ваш вопрос о школе…" autocomplete="off" rows="1"></textarea>
      <button class="send" id="send" type="submit" aria-label="Спросить">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 20V6M6 12l6-6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </footer>

<script>
const feed=document.getElementById('feed'), main=document.getElementById('main');
const form=document.getElementById('form'), input=document.getElementById('input'), sendBtn=document.getElementById('send');
const LOGO='/media/qletovo-logo.png';
const DOC_ICON='<svg viewBox="0 0 24 24" fill="none"><path d="M6 2h8l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" stroke="#143282" stroke-width="1.6"/><path d="M14 2v5h5" stroke="#143282" stroke-width="1.6"/></svg>';
const ARROW='<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)([^*\n]+?)\*(?!\*)/g,'$1<em>$2</em>');}
function scroll(){main.scrollTop=main.scrollHeight;}

function addUser(text){
  const el=document.createElement('div');el.className='row user';
  el.innerHTML='<div class="bubble">'+esc(text)+'</div>';
  feed.appendChild(el);scroll();
}
function addBot(){
  const el=document.createElement('div');el.className='row bot';
  el.innerHTML='<span class="avatar"><img src="'+LOGO+'" alt=""></span>'+
    '<div class="content"><div class="role">Ассистент</div>'+
    '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>';
  feed.appendChild(el);scroll();
  return el.querySelector('.bubble');
}
function renderAnswer(bubble,data){
  let html='<div class="text">'+fmt(data.answer)+'</div>';
  if(data.sources&&data.sources.length){
    html+='<div class="sources"><div class="label">Источники</div>';
    for(const s of data.sources){
      const pg=s.page?'<div class="pg">Страница '+esc(s.page)+'</div>':'';
      html+='<a class="src" href="'+esc(s.url)+'" target="_blank" rel="noopener">'+
        '<span class="ic">'+DOC_ICON+'</span>'+
        '<span class="meta"><div class="ttl">'+esc(s.title)+'</div>'+pg+'</span>'+
        '<span class="arrow">'+ARROW+'</span></a>';
    }
    html+='</div>';
  }
  bubble.innerHTML=html;scroll();
}

let history=[];  // [{role:'user'|'assistant', content}] для контекста диалога
let busy=false;  // пока идёт ответ — новый вопрос отправить нельзя
async function ask(q){
  busy=true;const bubble=addBot();sendBtn.disabled=true;
  try{
    const r=await fetch('/query',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q, history:history.slice(-6)})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();
    renderAnswer(bubble,data);
    history.push({role:'user',content:q});
    history.push({role:'assistant',content:data.answer});
  }catch(e){
    bubble.innerHTML='<div class="text">Сервис временно недоступен. Попробуйте, пожалуйста, позже.</div>';
  }finally{busy=false;sendBtn.disabled=false;input.focus();}
}

function submitQ(q){q=q.trim();if(!q||busy)return;addUser(q);input.value='';input.style.height='auto';ask(q);}

form.addEventListener('submit',e=>{e.preventDefault();submitQ(input.value);});
document.getElementById('chips').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(c)submitQ(c.dataset.q||c.textContent.trim());
});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px';});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});
input.focus();
</script>
</body>
</html>
