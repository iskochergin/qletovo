<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Документ — Летово</title>
<meta name="theme-color" content="#143282" />
<link rel="icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--navy:#143282; --navy-d:#0e2455; --line:#e9ecf4; --ink:#19203a; --muted:#6c7385;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; height:100dvh; background:#52555a;}
  header{
    background:#fff; border-top:3px solid var(--navy); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; padding:8px 14px; flex:none;
  }
  .back{
    display:inline-flex; align-items:center; gap:6px; color:#fff; background:var(--navy);
    text-decoration:none; font-weight:800; font-size:14px; border-radius:10px; padding:8px 14px; white-space:nowrap;
    transition:background .15s;
  }
  .back:hover{background:var(--navy-d);}
  .back svg{width:16px;height:16px;}
  .logo{width:30px;height:30px;object-fit:contain;flex:none;}
  .title{font-weight:800; color:var(--navy); font-size:15px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dl{color:var(--muted); text-decoration:none; font-weight:700; font-size:13px; border:1px solid var(--line); border-radius:10px; padding:8px 12px; white-space:nowrap;}
  .dl:hover{color:var(--navy); border-color:var(--navy);}
  iframe{flex:1; width:100%; border:none; background:#52555a;}
  @media (max-width:600px){
    header{padding:7px 10px; gap:9px;}
    .logo{display:none;} .dl{display:none;}
    .title{font-size:13px;} .back{padding:8px 12px;}
  }
</style>
</head>
<body>
  <header>
    <a class="back" href="/"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg> В чат</a>
    <img class="logo" src="/media/qletovo-logo.png" alt="" />
    <div class="title" id="title">Документ</div>
    <a class="dl" id="dl" href="#" target="_blank" rel="noopener">Скачать PDF</a>
  </header>
  <iframe id="pdf" title="Документ"></iframe>
<script>
  const name = decodeURIComponent(location.pathname.replace(/^\/viewer\//, ''));
  const qs = new URLSearchParams(location.search);
  const page = parseInt(qs.get('page') || '1', 10) || 1;
  const title = (qs.get('title') || name.replace(/\.pdf$/i, '')).trim();
  document.getElementById('title').textContent = title;
  document.title = title + ' — Летово';
  const fileUrl = '/files/' + encodeURIComponent(name);
  document.getElementById('pdf').src = fileUrl + '#page=' + page + '&view=FitH';
  document.getElementById('dl').href = fileUrl;
</script>
</body>
</html>
