# Контрольный набор для проверки метрик (раздел 5 ТЗ).
# type:
#   answerable      — ответ есть в документах; expect_any: хотя бы одна подстрока должна
#                     встретиться в ответе; expect_doc: подстрока в названии источника.
#   refuse_nodata   — вопрос про школу, но ответа в документах нет → ровно NO_DATA.
#   refuse_offtopic — вопрос вне зоны школы → вежливый отказ.

- q: "В какие классы можно поступить в школу Летово?"
  type: answerable
  expect_any: ["7", "11"]
  expect_doc: "приёма"

- q: "Какие документы нужны для поступления?"
  type: answerable
  expect_any: ["заявление", "согласие"]
  expect_doc: "приёма"

- q: "Сколько этапов отбора при поступлении?"
  type: answerable
  expect_any: ["6", "шест"]
  expect_doc: "приёма"

- q: "Что запрещено приносить учащимся на территорию школы?"
  type: answerable
  expect_any: ["табачн", "алкогол", "запрещ", "колющ"]
  expect_doc: "Кодекс"

- q: "Можно ли пользоваться телефоном на уроке?"
  type: answerable
  expect_any: ["не разрешается", "нельзя", "запрещ"]
  expect_doc: "Кодекс"

- q: "Что грозит за нарушение академической честности?"
  type: answerable
  expect_any: ["F", "0", "ноль", "мер", "дисциплин", "взыскан"]
  expect_doc: "Кодекс"

- q: "Какая форма одежды принята в школе?"
  type: answerable
  expect_any: ["делов", "форм"]
  expect_doc: "Кодекс"

- q: "Какие права есть у обучающихся?"
  type: answerable
  expect_any: ["право", "свобод"]
  expect_doc: "Кодекс"

- q: "Что такое академическая задолженность?"
  type: answerable
  expect_any: ["неудовлетворительн"]
  expect_doc: "оцениван"

- q: "В течение скольких дней формируется комиссия по апелляции?"
  type: answerable
  expect_any: ["двух", "2"]
  expect_doc: "оцениван"

- q: "Какой проходной балл для поступления?"
  type: refuse_nodata

- q: "Сколько стоит обучение в Летово?"
  type: refuse_nodata

- q: "Сколько учеников учится в школе?"
  type: refuse_nodata

- q: "Как написать быструю сортировку на Python?"
  type: refuse_offtopic

- q: "Посоветуй фильм на вечер."
  type: refuse_offtopic

- q: "Какая столица Австралии?"
  type: refuse_offtopic

- q: "Сколько будет 2+2?"
  type: refuse_offtopic
