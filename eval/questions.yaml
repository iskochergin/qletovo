# Контрольный набор для проверки метрик (раздел 5 ТЗ). Корпус: ~147 нормативных PDF школы.
# type:
#   answerable      — ответ есть в документах; expect_any: хотя бы одна подстрока в ответе;
#                     expect_doc (опц.): подстрока в названии источника.
#   refuse_nodata   — вопрос про школу, но ответа в документах нет → ровно NO_DATA.
#   refuse_offtopic — вопрос вне зоны школы → вежливый отказ.

- q: "Какие документы нужны для поступления?"
  type: answerable
  expect_any: ["заявление", "согласие", "документ"]

- q: "Что грозит за нарушение академической честности?"
  type: answerable
  expect_any: ["F", "мер", "взыскан", "0", "плагиат"]

- q: "Что запрещено приносить учащимся в школу?"
  type: answerable
  expect_any: ["табачн", "алкогол", "запрещ", "колющ"]

- q: "Можно ли пользоваться телефоном во время экзамена?"
  type: answerable
  expect_any: ["запрещ", "нельзя", "не разрешается", "контрольн", "экзамен"]

- q: "Какие права есть у обучающихся?"
  type: answerable
  expect_any: ["право", "свобод"]

- q: "Что такое академическая задолженность?"
  type: answerable
  expect_any: ["неудовлетворительн", "задолженност"]

- q: "Какая форма одежды принята в школе?"
  type: answerable
  expect_any: ["делов", "форм"]

- q: "Какой адрес у школы Летово?"
  type: answerable
  expect_any: ["Москва", "Сосенск", "Зимёнковск", "Зименковск"]

- q: "Что такое политика академической честности?"
  type: answerable
  expect_any: ["честност", "плагиат", "списыв", "недобросовест"]

- q: "В какие классы можно поступить в школу?"
  type: answerable
  expect_any: ["7", "8", "9", "10", "11", "класс"]

- q: "Какой проходной балл для поступления?"
  type: refuse_nodata

- q: "Какой пароль от Wi-Fi в школе?"
  type: refuse_nodata

- q: "Сколько мест на парковке у школы?"
  type: refuse_nodata

- q: "Какое меню в школьной столовой сегодня?"
  type: refuse_nodata

- q: "Как написать быструю сортировку на Python?"
  type: refuse_offtopic

- q: "Посоветуй фильм на вечер."
  type: refuse_offtopic

- q: "Какая столица Австралии?"
  type: refuse_offtopic

- q: "Сколько будет 2+2?"
  type: refuse_offtopic
